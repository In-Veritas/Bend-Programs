<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="7" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a5a9a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="470" fill="#f5efe1"/>
  <text x="410" y="32" text-anchor="middle" font-size="22" font-weight="600" fill="#3a2c1a">One tick: sweeps the grid in reading order</text>
  <text x="410" y="54" text-anchor="middle" font-size="13" fill="#7a6a52">scan_grid walks y; scan_row walks x. board and rng are "threaded" cell by cell.</text>

  <!-- grid 6x4 -->
  <g>
    <g stroke="#c8bda6" stroke-width="1" fill="#fffdf7">
      <rect x="60" y="90" width="360" height="240"/>
    </g>
    <g stroke="#ddd2b8" stroke-width="1">
      <line x1="120" y1="90" x2="120" y2="330"/>
      <line x1="180" y1="90" x2="180" y2="330"/>
      <line x1="240" y1="90" x2="240" y2="330"/>
      <line x1="300" y1="90" x2="300" y2="330"/>
      <line x1="360" y1="90" x2="360" y2="330"/>
      <line x1="60" y1="150" x2="420" y2="150"/>
      <line x1="60" y1="210" x2="420" y2="210"/>
      <line x1="60" y1="270" x2="420" y2="270"/>
    </g>
    <!-- snake path through cell centers (row-major). centers: x 90,150,210,270,330,390 ; y 120,180,240,300 -->
    <polyline points="90,120 390,120 390,180 90,180 90,240 390,240 390,300 90,300"
              fill="none" stroke="#3a5a9a" stroke-width="2.5" marker-end="url(#arrow3)" opacity="0.85"/>
    <circle cx="90" cy="120" r="5" fill="#3a5a9a"/>
    <text x="78" y="112" font-size="11" fill="#3a5a9a">start (0,0)</text>
  </g>

  <!-- per-cell call boxes -->
  <rect x="470" y="100" width="330" height="64" rx="9" fill="#fffdf7" stroke="#5c3a1a" stroke-width="2"/>
  <text x="486" y="124" font-size="13" font-weight="600" fill="#5c3a1a">scan_grid(board, y, rng)</text>
  <text x="486" y="146" font-size="11" fill="#7a6a52">y &lt; GH ? process row y, then y+1</text>

  <rect x="470" y="180" width="330" height="64" rx="9" fill="#fffdf7" stroke="#8b6f47" stroke-width="2"/>
  <text x="486" y="204" font-size="13" font-weight="600" fill="#6b4423">scan_row(board, y, x, rng)</text>
  <text x="486" y="226" font-size="11" fill="#7a6a52">x &lt; GW ? process cell x, then x+1</text>

  <rect x="470" y="260" width="330" height="86" rx="9" fill="#fffdf7" stroke="#3fa34d" stroke-width="2"/>
  <text x="486" y="284" font-size="13" font-weight="600" fill="#2e7d36">step_cell(board, x, y, rng)</text>
  <text x="486" y="306" font-size="11" fill="#7a6a52">empty → does nothing</text>
  <text x="486" y="324" font-size="11" fill="#7a6a52">occupied → decide(...) (see next diagram)</text>

  <line x1="635" y1="164" x2="635" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="635" y1="244" x2="635" y2="258" stroke="#444" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- single-buffer note -->
  <rect x="60" y="358" width="740" height="92" rx="10" fill="#fff7e6" stroke="#a06030" stroke-width="1.5"/>
  <text x="76" y="382" font-size="13" font-weight="600" fill="#a06030">Single buffer (snake order)</text>
  <text x="76" y="404" font-size="12" fill="#5c3a1a">The board is updated IN PLACE as it advances. A cell already modified in this sweep</text>
  <text x="76" y="422" font-size="12" fill="#5c3a1a">is seen by the following cells of the same tick. Each returned Step{board, rng}</text>
  <text x="76" y="440" font-size="12" fill="#5c3a1a">is passed along, so the same rng sequence never repeats within the tick.</text>
</svg>
