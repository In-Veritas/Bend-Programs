<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="430" fill="#f5efe1"/>
  <text x="410" y="32" text-anchor="middle" font-size="22" font-weight="600" fill="#3a2c1a">decide(): what happens in an occupied cell</text>

  <!-- step boxes -->
  <g font-size="12">
    <rect x="40"  y="80" width="150" height="74" rx="9" fill="#fffdf7" stroke="#5c3a1a" stroke-width="2"/>
    <text x="115" y="104" text-anchor="middle" font-weight="600" fill="#5c3a1a">1. neighbors</text>
    <text x="115" y="124" text-anchor="middle" fill="#7a6a52">board_neighbors8</text>
    <text x="115" y="140" text-anchor="middle" fill="#7a6a52">(the 8 around)</text>

    <rect x="220" y="80" width="150" height="74" rx="9" fill="#fffdf7" stroke="#c0556a" stroke-width="2"/>
    <text x="295" y="104" text-anchor="middle" font-weight="600" fill="#9a3b4f">2. random die</text>
    <text x="295" y="124" text-anchor="middle" fill="#7a6a52">rng1 = rng_next(rng)</text>
    <text x="295" y="140" text-anchor="middle" fill="#7a6a52">roll = rng1 % 100</text>

    <rect x="400" y="80" width="160" height="74" rx="9" fill="#fffdf7" stroke="#8b6f47" stroke-width="2"/>
    <text x="480" y="104" text-anchor="middle" font-weight="600" fill="#6b4423">3. maybe_mutate</text>
    <text x="480" y="124" text-anchor="middle" fill="#7a6a52">kind + neighbors + y</text>
    <text x="480" y="140" text-anchor="middle" fill="#7a6a52">+ roll → new_kind</text>

    <rect x="590" y="80" width="190" height="74" rx="9" fill="#fffdf7" stroke="#3fa34d" stroke-width="2"/>
    <text x="685" y="104" text-anchor="middle" font-weight="600" fill="#2e7d36">4. write new_kind</text>
    <text x="685" y="124" text-anchor="middle" fill="#7a6a52">board_set(x, y,</text>
    <text x="685" y="140" text-anchor="middle" fill="#7a6a52">some{new_kind})</text>

    <line x1="190" y1="117" x2="216" y2="117" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>
    <line x1="370" y1="117" x2="396" y2="117" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>
    <line x1="560" y1="117" x2="586" y2="117" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>
  </g>

  <!-- arrow down to spawn -->
  <line x1="685" y1="154" x2="685" y2="196" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- spawn -->
  <rect x="430" y="200" width="350" height="110" rx="9" fill="#fffdf7" stroke="#a06030" stroke-width="2"/>
  <text x="605" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#a06030">5. maybe_spawn(new_kind, ...)</text>
  <text x="448" y="250" font-size="12" fill="#7a6a52">• spawn_chance(kind) = 0 ? no spawn</text>
  <text x="448" y="270" font-size="12" fill="#7a6a52">• rolls a fresh die; if it passes the chance:</text>
  <text x="448" y="290" font-size="12" fill="#7a6a52">  picks a direction (pick_dir) and tries try_place</text>
  <text x="448" y="306" font-size="11" fill="#9a8a70">  (see the mutation and spawn diagrams)</text>

  <!-- result -->
  <rect x="40" y="200" width="360" height="110" rx="9" fill="#eef3ff" stroke="#3a5a9a" stroke-width="2"/>
  <text x="220" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#3a5a9a">Result: Step{board, rng}</text>
  <text x="58" y="252" font-size="12" fill="#3a5a9a">board = grid with the mutated cell</text>
  <text x="58" y="272" font-size="12" fill="#3a5a9a">       (+ maybe a new child)</text>
  <text x="58" y="292" font-size="12" fill="#3a5a9a">rng   = advanced seed, passed along</text>
  <line x1="430" y1="255" x2="404" y2="255" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- note -->
  <rect x="40" y="340" width="740" height="64" rx="10" fill="#fff7e6" stroke="#a06030" stroke-width="1.5"/>
  <text x="56" y="364" font-size="12" fill="#5c3a1a">Everything is pure: no cell mutates "in parallel". The mutation decides the NEW type, then the spawn</text>
  <text x="56" y="384" font-size="12" fill="#5c3a1a">uses that new type to pick the child (child_for) and the direction. roll is reused in both phases.</text>
</svg>
