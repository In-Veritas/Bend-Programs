<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>main</title>

<body>

  <script type="module">
// JavaScript runtime source for the BIRL JavaScript target.

// App Runtime
// ===========

// Bend-to-DOM bridge: decodes values, patches virtual DOM, and dispatches IO.

// Bend Value
// ==========

export function __app_mk(name, obj) {
  if (obj === undefined) {
    obj = {};
  }
  var sig = name + "/" + String(Object.keys(obj).length);
  var tag = __bend_tag_sig[sig];
  if (tag === undefined) {
    throw new Error("missing App constructor tag for " + sig);
  }
  obj.$ = name;
  obj.$t = tag;
  return obj;
}

export function __app_ctr(name, fields) {
  var obj = { $: name };
  for (var i = 0; i < fields.length; ++i) {
    obj["$" + String(i)] = fields[i];
  }
  var sig = name + "/" + String(fields.length);
  var tag = __bend_tag_sig[sig];
  if (tag === undefined) {
    throw new Error("missing App constructor tag for " + sig);
  }
  obj.$t = tag;
  return obj;
}

export function __app_fld(obj, idx) {
  return obj["$" + String(idx)];
}

export function __app_decode_string(str) {
  if (typeof str !== "string") {
    throw new Error("invalid Bend String value");
  }
  if (str.includes("\0")) {
    throw new Error("invalid Bend String value: NUL codepoint in IO string");
  }
  return str;
}

export function __app_encode_string(txt) {
  if (typeof txt !== "string") {
    throw new Error("invalid JavaScript string value");
  }
  return txt;
}

export function __app_list_from_array(items) {
  var out = __app_ctr("nil", []);
  for (var i = items.length - 1; i >= 0; --i) {
    out = __app_ctr("cons", [items[i], out]);
  }
  return out;
}

export function __app_list_array(lst) {
  var out = [];
  var cur = lst;
  while (cur !== null && typeof cur === "object") {
    if (cur.$ === "nil") {
      return out;
    }
    if (cur.$ === "cons") {
      out.push(__app_fld(cur, 0));
      cur = __app_fld(cur, 1);
      continue;
    }
    break;
  }
  throw new Error("invalid Bend List value");
}

export function __app_list_u32(lst) {
  var out = [];
  var cur = lst;
  while (cur !== null && typeof cur === "object") {
    if (cur.$ === "nil") {
      return out;
    }
    if (cur.$ === "cons") {
      out.push(__app_fld(cur, 0) >>> 0);
      cur = __app_fld(cur, 1);
      continue;
    }
    break;
  }
  throw new Error("invalid Bend List value");
}

export function __app_decode_color(color) {
  if (typeof color !== "number") {
    throw new Error("invalid Color value");
  }
  return color >>> 0;
}

export function __app_decode_color_array(buf) {
  if ((!Array.isArray(buf) && !ArrayBuffer.isView(buf)) || typeof buf.length !== "number") {
    throw new Error("invalid Array(Color) buffer");
  }
  var len = buf.length >>> 0;
  var out = new Array(len);
  for (var i = 0; i < len; ++i) {
    out[i] = __app_decode_color(buf[i]);
  }
  return out;
}

export function __app_decode_image(image) {
  if (image === null || typeof image !== "object") {
    throw new Error("invalid Image value");
  }
  switch (image.$) {
    case "grid": {
      var w = __app_fld(image, 0) >>> 0;
      var h = __app_fld(image, 1) >>> 0;
      var pixels = __app_decode_color_array(__app_fld(image, 2));
      if (pixels.length < w * h) {
        throw new Error("short Image pixel buffer");
      }
      return {
        w: w,
        h: h,
        pixels: pixels,
      };
    }
    default: {
      throw new Error("invalid Image constructor");
    }
  }
}

export function __app_decode_shader(shader) {
  if (shader === null || typeof shader !== "object") {
    throw new Error("invalid Shader value");
  }
  switch (shader.$) {
    case "shader": {
      var w = __app_fld(shader, 1) >>> 0;
      var h = __app_fld(shader, 2) >>> 0;
      var scene = __app_fld(shader, 3);
      var pixel = __app_fld(shader, 4);
      var pixels = new Array(w * h);
      for (var y = 0; y < h; ++y) {
        for (var x = 0; x < w; ++x) {
          var color = __apply(__apply(__apply(pixel, scene), x >>> 0), y >>> 0);
          pixels[y * w + x] = __app_decode_color(color);
        }
      }
      return {
        w: w,
        h: h,
        pixels: pixels,
      };
    }
    default: {
      throw new Error("invalid Shader constructor");
    }
  }
}

// Bitmap
// ======

export function __app_bmp_paint(canvas, w, h, pixels) {
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext("2d");
  var img = ctx.createImageData(w, h);
  var dat = img.data;
  var len = Math.min(pixels.length, w * h);
  for (var i = 0; i < len; ++i) {
    var p = pixels[i];
    dat[i * 4 + 0] = (p >>> 16) & 0xff;
    dat[i * 4 + 1] = (p >>> 8) & 0xff;
    dat[i * 4 + 2] = p & 0xff;
    dat[i * 4 + 3] = (p >>> 24) & 0xff;
  }
  ctx.putImageData(img, 0, 0);
}

// Event
// =====

export function __app_evt_value(evt) {
  var tgt = evt === null || typeof evt !== "object" ? null : evt.target;
  if (tgt === null || typeof tgt !== "object") {
    return "";
  }
  var val = tgt.value;
  return typeof val === "string" ? val : "";
}

export function __app_error_message(err) {
  return err instanceof Error ? err.message : String(err);
}

export function __app_encode_file(file, text) {
  var name = file !== null && typeof file === "object" && typeof file.name === "string" ? file.name : "";
  var mime = file !== null && typeof file === "object" && typeof file.type === "string" ? file.type : "";
  return __app_ctr("file", [
    __app_encode_string(name),
    __app_encode_string(mime),
    __app_encode_string(text),
  ]);
}

export function __app_encode_file_done(files) {
  return __app_ctr("done", [__app_list_from_array(files)]);
}

export function __app_encode_file_fail(err) {
  return __app_ctr("fail", [__app_encode_string(__app_error_message(err))]);
}

export function __app_file_text(file) {
  if (file !== null && typeof file === "object" && typeof file.text === "function") {
    return file.text();
  }
  return new Promise(function (resolve, reject) {
    if (typeof FileReader !== "function") {
      reject(new Error("This browser cannot read files."));
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      resolve(typeof reader.result === "string" ? reader.result : "");
    };
    reader.onerror = function () {
      reject(reader.error || new Error("The browser could not read the selected file."));
    };
    reader.readAsText(file);
  });
}

export async function __app_evt_files(evt) {
  var tgt = evt === null || typeof evt !== "object" ? null : evt.target;
  try {
    if (tgt === null || typeof tgt !== "object") {
      throw new Error("The file input event has no target.");
    }
    var got = tgt.files;
    if (got === null || typeof got !== "object") {
      throw new Error("The input target has no file list.");
    }
    var out = [];
    for (var i = 0; i < got.length; ++i) {
      var file = got[i];
      out.push(__app_encode_file(file, await __app_file_text(file)));
    }
    return __app_encode_file_done(out);
  } catch (err) {
    return __app_encode_file_fail(err);
  } finally {
    if (tgt !== null && typeof tgt === "object" && "value" in tgt) {
      tgt.value = "";
    }
  }
}

export function __app_evt_key(evt) {
  if (evt === null || typeof evt !== "object") {
    return 0;
  }
  var key = evt.which;
  if (typeof key === "number") {
    return key >>> 0;
  }
  key = evt.keyCode;
  if (typeof key === "number") {
    return key >>> 0;
  }
  return 0;
}

export function __app_root(val) {
  return __bend_share(val);
}

export function __app_u32(val) {
  if (typeof val !== "number" || !Number.isFinite(val) || val <= 0) {
    return 0;
  }
  if (val >= 0xffffffff) {
    return 0xffffffff;
  }
  return Math.floor(val) >>> 0;
}

export function __app_i32(val) {
  if (typeof val !== "number" || !Number.isFinite(val)) {
    return 0;
  }
  if (val <= -0x80000000) {
    return -0x80000000;
  }
  if (val >= 0x7fffffff) {
    return 0x7fffffff;
  }
  return Math.floor(val) | 0;
}

export function __app_mouse_pos(evt) {
  if (evt !== null && typeof evt === "object") {
    var tgt = evt.currentTarget;
    if (tgt !== null && typeof tgt === "object" && typeof tgt.getBoundingClientRect === "function") {
      var rect = tgt.getBoundingClientRect();
      var cw = typeof tgt.width === "number" ? tgt.width : rect.width;
      var ch = typeof tgt.height === "number" ? tgt.height : rect.height;
      if (rect.width > 0 && rect.height > 0) {
        var x = (evt.clientX - rect.left) * cw / rect.width;
        var y = (evt.clientY - rect.top) * ch / rect.height;
        return { x: __app_i32(x), y: __app_i32(y) };
      }
    }
    return { x: __app_i32(evt.offsetX), y: __app_i32(evt.offsetY) };
  }
  return { x: 0, y: 0 };
}

// Reads one element's rendered CSS-pixel size.
export function __app_element_size(el) {
  if (el !== null && typeof el === "object" && typeof el.getBoundingClientRect === "function") {
    var rect = el.getBoundingClientRect();
    var wid = __app_u32(rect.width);
    var hgt = __app_u32(rect.height);
    return { w: wid, h: hgt };
  }
  return { w: 0, h: 0 };
}

// HTML Decode
// ===========

export function __app_empty_attrs() {
  return {
    attrs: Object.create(null),
    props: Object.create(null),
    style: Object.create(null),
    on: Object.create(null),
    resize: null,
    fx: [],
  };
}

export function __app_pointer_dom_name(kind) {
  var has_pointer = typeof PointerEvent === "function";
  switch (kind) {
    case "down": {
      return has_pointer ? "pointerdown" : "mousedown";
    }
    case "up": {
      return has_pointer ? "pointerup" : "mouseup";
    }
    case "move": {
      return has_pointer ? "pointermove" : "mousemove";
    }
    case "enter": {
      return has_pointer ? "pointerenter" : "mouseenter";
    }
    case "leave": {
      return has_pointer ? "pointerleave" : "mouseleave";
    }
    default: {
      throw new Error("invalid HTML pointer event constructor");
    }
  }
}

export function __app_encode_pointer_kind(evt) {
  if (evt !== null && typeof evt === "object") {
    switch (evt.pointerType) {
      case "mouse": {
        return __app_ctr("mouse", []);
      }
      case "touch": {
        return __app_ctr("touch", []);
      }
      case "pen": {
        return __app_ctr("pen", []);
      }
    }
    if (evt.pointerType !== undefined) {
      return __app_ctr("unknown", []);
    }
  }
  return __app_ctr("mouse", []);
}

export function __app_encode_pointer(evt) {
  var pos = __app_mouse_pos(evt);
  var id = evt !== null && typeof evt === "object" && evt.pointerId !== undefined ? __app_i32(evt.pointerId) : 0;
  var button = evt !== null && typeof evt === "object" && evt.button !== undefined ? __app_i32(evt.button) : 0;
  return __app_ctr("pointer", [id, pos.x, pos.y, button, __app_encode_pointer_kind(evt)]);
}

export function __app_bind_pointer_event(out, kind, fun) {
  out.on[__app_pointer_dom_name(kind)] = function (evt) {
    return __apply(fun, __app_encode_pointer(evt));
  };
}

export function __app_decode_event(event, out) {
  if (event === null || typeof event !== "object") {
    throw new Error("invalid HTML event");
  }
  switch (event.$) {
    case "click": {
      var msg_clk = __app_root(__app_fld(event, 0));
      out.on.click = function () {
        return msg_clk;
      };
      break;
    }
    case "double_click": {
      var msg_dbl = __app_root(__app_fld(event, 0));
      out.on.dblclick = function () {
        return msg_dbl;
      };
      break;
    }
    case "input": {
      var fun_in = __app_root(__app_fld(event, 0));
      out.on.input = function (evt) {
        return __apply(fun_in, __app_encode_string(__app_evt_value(evt)));
      };
      break;
    }
    case "file": {
      var fun_file = __app_root(__app_fld(event, 0));
      out.on.change = function (evt) {
        return __app_evt_files(evt).then(function (res) {
          return __apply(fun_file, res);
        });
      };
      break;
    }
    case "key_down": {
      var fun_kdn = __app_root(__app_fld(event, 0));
      out.on.keydown = function (evt) {
        return __apply(fun_kdn, __app_evt_key(evt));
      };
      break;
    }
    case "key_up": {
      var fun_kup = __app_root(__app_fld(event, 0));
      out.on.keyup = function (evt) {
        return __apply(fun_kup, __app_evt_key(evt));
      };
      break;
    }
    case "pointer_down": {
      __app_bind_pointer_event(out, "down", __app_root(__app_fld(event, 0)));
      break;
    }
    case "pointer_up": {
      __app_bind_pointer_event(out, "up", __app_root(__app_fld(event, 0)));
      break;
    }
    case "pointer_move": {
      __app_bind_pointer_event(out, "move", __app_root(__app_fld(event, 0)));
      break;
    }
    case "pointer_enter": {
      __app_bind_pointer_event(out, "enter", __app_root(__app_fld(event, 0)));
      break;
    }
    case "pointer_leave": {
      __app_bind_pointer_event(out, "leave", __app_root(__app_fld(event, 0)));
      break;
    }
    case "wheel": {
      var fun_whl = __app_root(__app_fld(event, 0));
      out.on.wheel = function (evt) {
        var pos = __app_mouse_pos(evt);
        var dir = evt !== null && typeof evt === "object" && evt.deltaY > 0 ? 1 : 0;
        return __apply(__apply(__apply(fun_whl, dir), pos.x), pos.y);
      };
      break;
    }
    case "resize": {
      out.resize = __app_root(__app_fld(event, 0));
      break;
    }
    default: {
      throw new Error("invalid HTML event constructor");
    }
  }
}

export function __app_decode_attrs(attrs) {
  var out = __app_empty_attrs();
  for (var attr of __app_list_array(attrs)) {
    if (attr === null || typeof attr !== "object") {
      throw new Error("invalid HTML attr");
    }
    switch (attr.$) {
      case "attr": {
        out.attrs[__app_decode_string(__app_fld(attr, 0))] = __app_decode_string(__app_fld(attr, 1));
        break;
      }
      case "prop": {
        out.props[__app_decode_string(__app_fld(attr, 0))] = __app_decode_string(__app_fld(attr, 1));
        break;
      }
      case "style": {
        out.style[__app_decode_string(__app_fld(attr, 0))] = __app_decode_string(__app_fld(attr, 1));
        break;
      }
      case "on": {
        __app_decode_event(__app_fld(attr, 0), out);
        break;
      }
      case "every_ms": {
        var ms = __app_fld(attr, 0) >>> 0;
        var msg_tick = __app_root(__app_fld(attr, 1));
        out.fx.push({ $: "every_ms", ms: ms, msg: msg_tick });
        break;
      }
      default: {
        throw new Error("invalid HTML attr constructor");
      }
    }
  }
  return out;
}

export function __app_decode_html(view) {
  if (view === null || typeof view !== "object") {
    throw new Error("invalid HTML value");
  }
  switch (view.$) {
    case "text": {
      return { $: "text", value: __app_decode_string(__app_fld(view, 0)) };
    }
    case "node": {
      var tag = __app_decode_string(__app_fld(view, 0));
      var attrs = __app_decode_attrs(__app_fld(view, 1));
      var kids = __app_list_array(__app_fld(view, 2)).map(__app_decode_html);
      return { $: "node", tag: tag, attrs: attrs, kids: kids };
    }
    case "bmp": {
      var image = __app_decode_image(__app_fld(view, 0));
      var attrs = __app_decode_attrs(__app_fld(view, 1));
      return { $: "bmp", w: image.w, h: image.h, pixels: image.pixels, attrs: attrs };
    }
    case "shader": {
      var shader = __app_decode_shader(__app_fld(view, 0));
      var attrs = __app_decode_attrs(__app_fld(view, 1));
      return { $: "bmp", w: shader.w, h: shader.h, pixels: shader.pixels, attrs: attrs };
    }
    default: {
      throw new Error("invalid HTML constructor");
    }
  }
}

// DOM Attributes
// ==============

export function __app_set_attr(el, nam, val) {
  if (nam === "value" && "value" in el) {
    if (el.value !== val) {
      el.value = val;
    }
    return;
  }
  el.setAttribute(nam, val);
}

export function __app_del_attr(el, nam) {
  if (nam === "value" && "value" in el) {
    el.value = "";
  }
  el.removeAttribute(nam);
}

export function __app_set_prop(el, nam, val) {
  if (nam in el) {
    el[nam] = val;
  } else {
    el.setAttribute(nam, val);
  }
}

export function __app_del_prop(el, nam) {
  if (nam in el) {
    el[nam] = "";
  }
  el.removeAttribute(nam);
}

export function __app_patch_attrs(el, prev, next) {
  for (var nam in prev.attrs) {
    if (!(nam in next.attrs)) {
      __app_del_attr(el, nam);
    }
  }
  for (var nam in next.attrs) {
    if (prev.attrs[nam] !== next.attrs[nam]) {
      __app_set_attr(el, nam, next.attrs[nam]);
    }
  }
  for (var nam in prev.props) {
    if (!(nam in next.props)) {
      __app_del_prop(el, nam);
    }
  }
  for (var nam in next.props) {
    if (prev.props[nam] !== next.props[nam]) {
      __app_set_prop(el, nam, next.props[nam]);
    }
  }
  for (var nam in prev.style) {
    if (!(nam in next.style)) {
      el.style.removeProperty(nam);
    }
  }
  for (var nam in next.style) {
    if (prev.style[nam] !== next.style[nam]) {
      el.style.setProperty(nam, next.style[nam]);
    }
  }
}

// Event Binding
// =============

export function __app_bind_dom(el, nam, get_msg, dispatch) {
  var handler = function (evt) {
    if (nam === "keydown" || nam === "keyup" || nam === "wheel") {
      evt.preventDefault();
    }
    var got = get_msg(evt);
    if (got !== null && typeof got === "object" && typeof got.then === "function") {
      got.then(function (msg) {
        dispatch(msg);
      }).catch(function (err) {
        console.error(err);
      });
      return;
    }
    dispatch(got);
  };
  el.addEventListener(nam, handler);
  return function () {
    el.removeEventListener(nam, handler);
  };
}

// Binds one resize observer effect to an element.
export function __app_bind_resize(el, fun, dispatch) {
  var tid = 0;
  var live = true;
  function emit() {
    tid = 0;
    if (!live) {
      return;
    }
    var siz = __app_element_size(el);
    var old = el.__bend_resize_size;
    if (old !== undefined && old.w === siz.w && old.h === siz.h) {
      return;
    }
    el.__bend_resize_size = siz;
    dispatch(__apply(__apply(fun, siz.w), siz.h));
  }
  function queue() {
    if (live && tid === 0) {
      tid = setTimeout(emit, 0);
    }
  }
  var obs = null;
  if (typeof ResizeObserver === "function") {
    obs = new ResizeObserver(queue);
    obs.observe(el);
  } else {
    window.addEventListener("resize", queue);
  }
  queue();
  return function () {
    live = false;
    if (tid !== 0) {
      clearTimeout(tid);
    }
    if (obs !== null) {
      obs.disconnect();
    } else {
      window.removeEventListener("resize", queue);
    }
  };
}

export function __app_bind_fx(fx, dispatch) {
  switch (fx.$) {
    case "every_ms": {
      var msg = __app_root(fx.msg);
      var timer = setInterval(function () {
        dispatch(msg);
      }, fx.ms);
      return function () {
        clearInterval(timer);
      };
    }
    default: {
      throw new Error("invalid App binding");
    }
  }
}

export function __app_clear_bindings(dom) {
  if (dom === null || typeof dom !== "object") {
    return;
  }
  var got = dom.__bend_bindings;
  if (got === undefined) {
    return;
  }
  for (var off of got) {
    off();
  }
  delete dom.__bend_bindings;
}

export function __app_has_bindings(next) {
  for (var nam in next.on) {
    return true;
  }
  return next.resize !== null || next.fx.length !== 0;
}

export function __app_patch_bindings(el, next, dispatch) {
  __app_clear_bindings(el);
  if (next.resize === null) {
    delete el.__bend_resize_size;
  }
  if (!__app_has_bindings(next)) {
    return;
  }
  var got = [];
  for (var nam in next.on) {
    got.push(__app_bind_dom(el, nam, next.on[nam], dispatch));
  }
  if (next.resize !== null) {
    got.push(__app_bind_resize(el, next.resize, dispatch));
  }
  for (var fx of next.fx) {
    got.push(__app_bind_fx(fx, dispatch));
  }
  el.__bend_bindings = got;
}

export function __app_dispose(dom) {
  if (dom === null || typeof dom !== "object") {
    return;
  }
  __app_clear_bindings(dom);
  if ("childNodes" in dom) {
    for (var kid of dom.childNodes) {
      __app_dispose(kid);
    }
  }
}

// DOM Patch
// =========

var __SVG_NS = "http://www.w3.org/2000/svg";

export function __app_mount(view, dispatch, svg) {
  switch (view.$) {
    case "text": {
      return document.createTextNode(view.value);
    }
    case "node": {
      var isSvg = svg || view.tag === "svg";
      var el = isSvg ? document.createElementNS(__SVG_NS, view.tag) : document.createElement(view.tag);
      __app_patch_attrs(el, __app_empty_attrs(), view.attrs);
      __app_patch_bindings(el, view.attrs, dispatch);
