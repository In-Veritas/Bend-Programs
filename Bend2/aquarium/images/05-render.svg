<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#06121b"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#7fdfff">Drawing the tank</text>

  <!-- open-topped tank illustration -->
  <!-- left wall -->
  <polygon points="60,164 90,150 90,390 60,376" fill="rgba(110,175,210,0.38)" stroke="#6fb6cf" stroke-width="1"/>
  <!-- right wall -->
  <polygon points="380,150 410,164 410,376 380,390" fill="rgba(60,130,175,0.42)" stroke="#6fb6cf" stroke-width="1"/>
  <!-- front face: borders on left / right / bottom only (open top) -->
  <rect x="90" y="150" width="290" height="240" fill="rgba(120,185,222,0.18)"/>
  <line x1="90" y1="150" x2="90" y2="390" stroke="#82bed7" stroke-width="2"/>
  <line x1="380" y1="150" x2="380" y2="390" stroke="#82bed7" stroke-width="2"/>
  <line x1="90" y1="390" x2="380" y2="390" stroke="#82bed7" stroke-width="2"/>

  <!-- water wavy top inside front -->
  <path d="M90 200 q 18 -10 36 0 q 18 10 36 0 q 18 -10 36 0 q 18 10 36 0 q 18 -10 36 0 q 18 10 36 0 q 18 -10 36 0 L380 390 L90 390 Z"
        fill="rgba(56,150,200,0.45)"/>
  <path d="M90 200 q 18 -10 36 0 q 18 10 36 0 q 18 -10 36 0 q 18 10 36 0 q 18 -10 36 0 q 18 10 36 0 q 18 -10 36 0"
        fill="none" stroke="rgba(225,248,255,0.9)" stroke-width="2"/>

  <!-- a few creatures -->
  <circle cx="180" cy="175" r="4" fill="#ff9a44"/>
  <text x="250" y="250" font-size="16" fill="#7a4a1a" font-family="monospace" font-weight="800">o&lt;</text>
  <text x="160" y="320" font-size="15" font-family="monospace" font-weight="800" fill="#1f9a4d">(O&lt;</text>
  <text x="280" y="370" font-size="15" font-family="monospace" font-weight="800" fill="#3f78d6">(.* )&lt;3</text>

  <!-- labels -->
  <text x="235" y="138" text-anchor="middle" font-size="11" fill="#9fd6ec">open top (no upper wall)</text>
  <text x="425" y="256" font-size="11" fill="#9fd6ec">right wall</text>
  <text x="425" y="270" font-size="11" fill="#9fd6ec">(clip-path)</text>
  <text x="22" y="270" font-size="11" fill="#9fd6ec">left wall</text>

  <!-- right column explanation -->
  <rect x="470" y="70" width="400" height="150" rx="10" fill="#0b2233" stroke="#16465e" stroke-width="2"/>
  <text x="670" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#bfe0ef">Open-top tank = 3 divs</text>
  <text x="488" y="120" font-size="12" fill="#bcd9e6">• front face: the interactive water box</text>
  <text x="488" y="140" font-size="12" fill="#bcd9e6">  (pointer handlers · borders L/R/bottom)</text>
  <text x="488" y="162" font-size="12" fill="#bcd9e6">• two side walls: thin clip-path slabs</text>
  <text x="488" y="182" font-size="12" fill="#bcd9e6">  that fly off when the tank breaks</text>
  <text x="488" y="206" font-size="11.5" fill="#7aa9bd">cursor coords map straight to sim x,y</text>

  <rect x="470" y="236" width="400" height="84" rx="10" fill="#0b2233" stroke="#16465e" stroke-width="2"/>
  <text x="670" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#bfe0ef">Waves</text>
  <text x="488" y="284" font-size="12" fill="#bcd9e6">56 vertical segments; each top edge =</text>
  <text x="488" y="304" font-size="12" font-family="monospace" fill="#a9d2e2">WATER_Y + AMP·sin(tick·s + i·f)</text>

  <rect x="470" y="336" width="400" height="84" rx="10" fill="#0b2233" stroke="#16465e" stroke-width="2"/>
  <text x="670" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#bfe0ef">Sprites</text>
  <text x="488" y="379" font-size="12" fill="#bcd9e6">absolute div · scaleX by facing · size grows</text>
  <text x="488" y="397" font-size="12" fill="#bcd9e6">with `size` · tail flaps every 6 ticks</text>
  <text x="488" y="415" font-size="11.5" fill="#7aa9bd">fry brown · juvenile dark green · adult dark blue</text>

  <text x="60" y="410" font-size="11" fill="#9fd6ec">On break: side walls fly off, water drains, shards fly, fish fall (X eyes).</text>
</svg>
