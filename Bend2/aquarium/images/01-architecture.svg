<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b6f8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="430" fill="#06121b"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#7fdfff">The Elm-style App loop</text>

  <!-- State -->
  <rect x="330" y="70" width="200" height="120" rx="10" fill="#0b2233" stroke="#16465e" stroke-width="2"/>
  <text x="430" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#bfe0ef">State</text>
  <text x="346" y="118" font-size="12" fill="#9fc7d8" font-family="monospace">ents : List(Ent)</text>
  <text x="346" y="138" font-size="12" fill="#9fc7d8" font-family="monospace">tick : U32</text>
  <text x="346" y="158" font-size="12" fill="#9fc7d8" font-family="monospace">rng  : U32</text>
  <text x="346" y="178" font-size="12" fill="#9fc7d8" font-family="monospace">phase: Phase</text>

  <!-- render -->
  <rect x="610" y="90" width="210" height="80" rx="10" fill="#0b2233" stroke="#16465e" stroke-width="2"/>
  <text x="715" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#bfe0ef">render</text>
  <text x="715" y="138" text-anchor="middle" font-size="11.5" fill="#9fc7d8">State → HTML(Event)</text>
  <text x="715" y="156" text-anchor="middle" font-size="11" fill="#7aa9bd">cube · waves · sprites · overlays</text>

  <!-- browser -->
  <rect x="610" y="250" width="210" height="90" rx="10" fill="#10303f" stroke="#1d5b75" stroke-width="2"/>
  <text x="715" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#bfe0ef">Browser DOM</text>
  <text x="715" y="300" text-anchor="middle" font-size="11.5" fill="#9fc7d8">paints the cube</text>
  <text x="715" y="320" text-anchor="middle" font-size="11.5" fill="#9fc7d8">every_ms timer + clicks</text>

  <!-- on_event -->
  <rect x="40" y="90" width="220" height="120" rx="10" fill="#0b2233" stroke="#16465e" stroke-width="2"/>
  <text x="150" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#bfe0ef">on_event</text>
  <text x="150" y="140" text-anchor="middle" font-size="11.5" fill="#9fc7d8">press/move/release</text>
  <text x="150" y="160" text-anchor="middle" font-size="11.5" fill="#9fc7d8">  → pour / hold / start</text>
  <text x="150" y="184" text-anchor="middle" font-size="11.5" fill="#9fc7d8">tick_ev → one_tick(s)</text>

  <!-- one_tick -->
  <rect x="40" y="250" width="220" height="120" rx="10" fill="#10303f" stroke="#1d5b75" stroke-width="2"/>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#7fe0c0">one_tick</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#a9e6d6">1. do_eat  (assign meals)</text>
  <text x="150" y="320" text-anchor="middle" font-size="12" fill="#a9e6d6">2. move_all (physics)</text>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#83c3b3">break? → phase_over{score}</text>

  <!-- arrows -->
  <line x1="530" y1="130" x2="606" y2="130" stroke="#2b6f8a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="568" y="122" text-anchor="middle" font-size="10" fill="#6fb6cf">draw</text>
  <line x1="715" y1="170" x2="715" y2="246" stroke="#2b6f8a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="610" y1="300" x2="262" y2="160" stroke="#2b6f8a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="430" y="232" text-anchor="middle" font-size="10" fill="#6fb6cf">events (tick / pointer)</text>
  <line x1="150" y1="210" x2="150" y2="246" stroke="#2b6f8a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="260" y1="300" x2="326" y2="170" stroke="#2b6f8a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="300" y="244" text-anchor="middle" font-size="10" fill="#6fb6cf">new State</text>

  <text x="430" y="406" text-anchor="middle" font-size="12" fill="#5f8294">Pure functions only: each frame maps the old State to a new one; the runtime diffs the HTML and repaints.</text>
</svg>
