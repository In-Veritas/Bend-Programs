<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="430" fill="#f5efe1"/>
  <text x="410" y="32" text-anchor="middle" font-size="22" font-weight="600" fill="#3a2c1a">From the clicked pixel to the grid cell</text>

  <!-- grid: 8 cols x 6 rows of 40px each (representando GW x GH com PX) -->
  <g>
    <!-- cells -->
    <g stroke="#c8bda6" stroke-width="1" fill="#fffdf7">
        <!-- draw 8x6 -->
      <rect x="60" y="80" width="320" height="240"/>
    </g>
    <!-- grid lines -->
    <g stroke="#ddd2b8" stroke-width="1">
      <line x1="100" y1="80" x2="100" y2="320"/>
      <line x1="140" y1="80" x2="140" y2="320"/>
      <line x1="180" y1="80" x2="180" y2="320"/>
      <line x1="220" y1="80" x2="220" y2="320"/>
      <line x1="260" y1="80" x2="260" y2="320"/>
      <line x1="300" y1="80" x2="300" y2="320"/>
      <line x1="340" y1="80" x2="340" y2="320"/>
      <line x1="60" y1="120" x2="380" y2="120"/>
      <line x1="60" y1="160" x2="380" y2="160"/>
      <line x1="60" y1="200" x2="380" y2="200"/>
      <line x1="60" y1="240" x2="380" y2="240"/>
      <line x1="60" y1="280" x2="380" y2="280"/>
    </g>
    <!-- highlighted target cell cx=3, cy=2 -> x 60+3*40=180, y 80+2*40=160 -->
    <rect x="180" y="160" width="40" height="40" fill="#a06030" opacity="0.85"/>
    <text x="200" y="185" text-anchor="middle" font-size="16" fill="#fff">🌱</text>
  </g>

  <!-- click marker at pixel (px,py) inside that cell -->
  <circle cx="205" cy="188" r="6" fill="#c0556a" stroke="#fff" stroke-width="2"/>
  <line x1="205" y1="188" x2="470" y2="120" stroke="#c0556a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>

  <!-- axes -->
  <line x1="60" y1="68" x2="380" y2="68" stroke="#5c3a1a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="370" y="60" font-size="12" fill="#5c3a1a">x (columns →)</text>
  <line x1="48" y1="80" x2="48" y2="320" stroke="#5c3a1a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="14" y="210" font-size="12" fill="#5c3a1a" transform="rotate(-90 22 210)">y (rows ↓)</text>
  <text x="52" y="76" font-size="11" fill="#5c3a1a">(0,0)</text>

  <!-- formula panel -->
  <rect x="470" y="90" width="320" height="200" rx="10" fill="#fffdf7" stroke="#5c3a1a" stroke-width="2"/>
  <text x="486" y="118" font-size="14" font-weight="600" fill="#5c3a1a">plant_seed: pixel → cell</text>
  <text x="486" y="148" font-size="13" font-family="monospace" fill="#3a2c1a">px, py  = click pixels</text>
  <text x="486" y="172" font-size="13" font-family="monospace" fill="#3a2c1a">cx = px // PX   (// = integer div)</text>
  <text x="486" y="196" font-size="13" font-family="monospace" fill="#3a2c1a">cy = py // PX</text>
  <text x="486" y="220" font-size="13" font-family="monospace" fill="#3a2c1a">PX = 14  (px per cell)</text>
  <text x="486" y="252" font-size="12" fill="#7a6a52">If Grid/in_bounds(GW,GH,cx,cy):</text>
  <text x="486" y="270" font-size="12" fill="#7a6a52">write some{seed{}} at (cx, cy)</text>

  <!-- bottom note -->
  <rect x="60" y="350" width="730" height="56" rx="10" fill="#fff7e6" stroke="#a06030" stroke-width="1.5"/>
  <text x="76" y="374" font-size="12" fill="#5c3a1a">The grid is GW=46 columns x GH=34 rows. Each cell becomes a PX=14px square on screen.</text>
  <text x="76" y="394" font-size="12" fill="#5c3a1a">A click only plants while phase = phase_empty; the cy row becomes the "soil", the reference for all height.</text>
</svg>
