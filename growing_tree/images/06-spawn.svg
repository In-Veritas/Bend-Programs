<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a6" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="a6g" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c7837"/>
    </marker>
    <marker id="a6d" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5c3a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="540" fill="#f5efe1"/>
  <text x="430" y="32" text-anchor="middle" font-size="22" font-weight="600" fill="#3a2c1a">maybe_spawn: growth direction by zone (relative to the soil)</text>

  <!-- ===== Scene: vertical zones around the soil line ===== -->
  <rect x="60" y="70" width="250" height="430" rx="6" fill="#fffdf7" stroke="#c8bda6"/>
  <!-- soil line -->
  <line x1="60" y1="300" x2="310" y2="300" stroke="#b08d57" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="318" y="296" font-size="12" fill="#a06030" font-weight="600">soil</text>
  <text x="318" y="312" font-size="11" fill="#a06030">(soil)</text>

  <!-- canopy zone -->
  <text x="185" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d36">canopy (above ≥ CANOPY_START)</text>
  <circle cx="150" cy="120" r="8" fill="#3fa34d"/><circle cx="185" cy="110" r="8" fill="#3fa34d"/>
  <circle cx="220" cy="122" r="8" fill="#3fa34d"/><circle cx="200" cy="135" r="8" fill="#3fa34d"/>
  <line x1="170" y1="190" x2="158" y2="146" stroke="#2c7837" stroke-width="2.5" marker-end="url(#a6g)"/>
  <line x1="178" y1="190" x2="205" y2="150" stroke="#2c7837" stroke-width="2" marker-end="url(#a6g)"/>
  <text x="120" y="180" font-size="10" fill="#2e7d36">rises and forks → leaf</text>

  <!-- trunk zone -->
  <rect x="166" y="196" width="34" height="100" fill="#6b4423"/>
  <text x="185" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">trunk</text>
  <line x1="166" y1="250" x2="120" y2="250" stroke="#8b6f47" stroke-width="3" marker-end="url(#a6)"/>
  <line x1="200" y1="250" x2="246" y2="250" stroke="#8b6f47" stroke-width="3" marker-end="url(#a6)"/>
  <text x="92" y="284" font-size="10" fill="#6b4423">trunk zone (above ≤ TRUNK_H):</text>
  <text x="120" y="298" font-size="10" fill="#6b4423" opacity="0"> </text>
  <text x="150" y="234" font-size="9" fill="#fff">↔ widens</text>

  <!-- root zone: shallow spreads sideways (thick base), deep goes vertical -->
  <!-- shallow lateral arrows just below the soil -->
  <rect x="160" y="300" width="48" height="16" fill="#5c3a1a"/>
  <line x1="172" y1="320" x2="120" y2="320" stroke="#5c3a1a" stroke-width="3" marker-end="url(#a6d)"/>
  <line x1="196" y1="320" x2="248" y2="320" stroke="#5c3a1a" stroke-width="3" marker-end="url(#a6d)"/>
  <text x="185" y="338" text-anchor="middle" font-size="10" fill="#5c3a1a">shallow: ↔ widens the base</text>
  <!-- deep vertical tendrils -->
  <line x1="178" y1="345" x2="178" y2="400" stroke="#5c3a1a" stroke-width="2.5" marker-end="url(#a6d)"/>
  <line x1="190" y1="352" x2="190" y2="408" stroke="#5c3a1a" stroke-width="2.5" marker-end="url(#a6d)"/>
  <text x="185" y="448" text-anchor="middle" font-size="11" fill="#5c3a1a">deep: ↓ vertical tendrils (taper, go deep)</text>

  <text x="185" y="478" text-anchor="middle" font-size="11" fill="#7a6a52">above = aerial · below = roots</text>
  <text x="185" y="492" text-anchor="middle" font-size="10" fill="#7a6a52">roots never rise</text>

  <!-- ===== Right panels ===== -->
  <!-- spawn_chance -->
  <rect x="350" y="70" width="220" height="150" rx="10" fill="#fffdf7" stroke="#5c3a1a" stroke-width="2"/>
  <text x="460" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3a1a">spawn_chance (out of 100)</text>
  <g font-size="13" font-family="monospace">
    <rect x="368" y="104" width="13" height="13" fill="#a06030"/><text x="388" y="115" fill="#3a2c1a">seed   = 70</text>
    <rect x="368" y="126" width="13" height="13" fill="#5c3a1a"/><text x="388" y="137" fill="#3a2c1a">root   = 30</text>
    <rect x="368" y="148" width="13" height="13" fill="#8b6f47"/><text x="388" y="159" fill="#3a2c1a">branch = 60</text>
    <rect x="368" y="170" width="13" height="13" fill="#6b4423"/><text x="388" y="181" fill="#3a2c1a">bark   = 0</text>
    <rect x="368" y="192" width="13" height="13" fill="#3fa34d"/><text x="388" y="203" fill="#3a2c1a">leaf   = 0</text>
  </g>

  <!-- child_for_y -->
  <rect x="590" y="70" width="230" height="150" rx="10" fill="#fffdf7" stroke="#a06030" stroke-width="2"/>
  <text x="705" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#a06030">child_for_y(ny, soil)</text>
  <text x="606" y="118" font-size="12" fill="#7a6a52">the child is decided by WHERE it lands:</text>
  <text x="606" y="142" font-size="12" fill="#2e7d36">above the soil (ny &lt; soil) → branch</text>
  <text x="606" y="166" font-size="12" fill="#5c3a1a">at the soil or below → root</text>
  <text x="606" y="192" font-size="11" fill="#7a6a52">  that's why the seed sprouting</text>
  <text x="606" y="206" font-size="11" fill="#7a6a52">  sideways drops roots beside the trunk</text>

  <!-- density gate -->
  <rect x="350" y="240" width="470" height="120" rx="10" fill="#fffdf7" stroke="#c0556a" stroke-width="2"/>
  <text x="585" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3b4f">try_place — anti-blob gate</text>
  <text x="368" y="290" font-size="12" fill="#5c3a1a">Only plants if the target is inside the grid, empty, AND has fewer than</text>
  <text x="368" y="310" font-size="12" fill="#5c3a1a">CROWD_LIMIT = 3 occupied neighbors → thin, branched structure.</text>
  <text x="368" y="336" font-size="12" fill="#5c3a1a">Shallow root spreads sideways (thickens the base); deep root goes straight</text>
  <text x="368" y="354" font-size="12" fill="#5c3a1a">down (~80% S) in vertical tendrils that go deep and taper. Never rise.</text>

  <!-- summary -->
  <rect x="350" y="380" width="470" height="120" rx="10" fill="#fff7e6" stroke="#a06030" stroke-width="1.5"/>
  <text x="585" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#a06030">why it becomes a tree</text>
  <text x="368" y="428" font-size="12" fill="#5c3a1a">• canopy relative to the soil → leaves wherever you plant;</text>
  <text x="368" y="448" font-size="12" fill="#5c3a1a">• trunk zone widens and darkens → thick trunk;</text>
  <text x="368" y="468" font-size="12" fill="#5c3a1a">• shallow roots widen the base and deep ones descend deep; never rise;</text>
  <text x="368" y="488" font-size="12" fill="#5c3a1a">• density gate prevents the brown disk.</text>
</svg>
